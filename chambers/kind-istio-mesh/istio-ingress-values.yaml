# Values for the istio/gateway chart: expose the ingress gateway on a fixed
# NodePort (mapped to host 18081 by the kind config) and label the pods
# istio=ingressgateway so the Gateway resource's selector matches.
service:
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 30080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
      nodePort: 30443
labels:
  istio: ingressgateway
