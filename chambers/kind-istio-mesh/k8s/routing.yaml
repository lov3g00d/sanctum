# DestinationRule declares the v1/v2 subsets by pod label; the Gateway exposes
# the app on the ingress gateway; the VirtualService splits traffic between the
# subsets by weight. The demos patch these weights (canary shifts gradually,
# blue-green flips instantly).
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: web
  namespace: web
spec:
  host: web.web.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: web-gw
  namespace: web
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web
  namespace: web
spec:
  hosts:
    - "*"
  gateways:
    - web-gw
  http:
    - route:
        - destination:
            host: web.web.svc.cluster.local
            subset: v1
          weight: 100
        - destination:
            host: web.web.svc.cluster.local
            subset: v2
          weight: 0
