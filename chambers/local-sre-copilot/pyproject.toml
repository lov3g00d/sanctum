[project]
name = "sre-copilot"
version = "0.1.0"
description = "An SRE on-call copilot: RAG over runbooks + MCP tools + a LangGraph multi-agent supervisor, all local."
requires-python = ">=3.12,<3.14"

# Only top-level libraries are pinned (to major/minor); uv resolves the
# transitive graph (mcp, qdrant-client, langchain-core, ...). Embeddings come
# from Ollama, so no fastembed/onnxruntime binary wheels are needed.
dependencies = [
    "langchain>=1.3,<2",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.2,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-qdrant>=1.1,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "qdrant-client>=1.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv]
package = false
