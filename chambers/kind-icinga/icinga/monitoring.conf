object TimePeriod "always" {
  display_name = "Always"
  ranges = {
    "monday"    = "00:00-24:00"
    "tuesday"   = "00:00-24:00"
    "wednesday" = "00:00-24:00"
    "thursday"  = "00:00-24:00"
    "friday"    = "00:00-24:00"
    "saturday"  = "00:00-24:00"
    "sunday"    = "00:00-24:00"
  }
}

object Host "webapp" {
  display_name = "Sample Web App"
  address = "webapp.web.svc.cluster.local"
  check_command = "http"
  vars.http_port = 8080
  vars.http_uri = "/"
  check_interval = 15s
  retry_interval = 5s
  max_check_attempts = 2
}

object Service "http-health" {
  host_name = "webapp"
  display_name = "HTTP /healthz"
  check_command = "http"
  vars.http_port = 8080
  vars.http_uri = "/healthz"
  check_interval = 15s
  retry_interval = 5s
  max_check_attempts = 2
}

object User "ops-oncall" {
  display_name = "Ops On-Call"
  enable_notifications = true
  states = [ OK, Warning, Critical, Unknown ]
  types = [ Problem, Recovery ]
}

object NotificationCommand "file-log" {
  command = [
    "/bin/sh", "-c",
    "printf '%s type=%s host=%s service=%s state=%s output=%s\\n' '$icinga.long_date_time$' '$notification.type$' '$host.name$' '$service.name$' '$service.state$' '$service.output$' >> /var/lib/icinga2/notify.log"
  ]
}

apply Notification "ops-http" to Service {
  command = "file-log"
  users = [ "ops-oncall" ]
  period = "always"
  states = [ OK, Warning, Critical ]
  types = [ Problem, Recovery ]
  interval = 0

  assign where service.name == "http-health"
}
