apiVersion: apps/v1
kind: Deployment
metadata:
  name: loggen
  namespace: elk
  labels:
    app: loggen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loggen
  template:
    metadata:
      labels:
        app: loggen
    spec:
      containers:
        - name: loggen
          image: loggen:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: loggen
  namespace: elk
spec:
  selector:
    app: loggen
  ports:
    - name: http
      port: 8080
      targetPort: http
