---
# Severity taxonomy: severity=page wakes someone (PagerDuty), severity=ticket is
# investigated in hours (Slack). The only things that page are direct
# user-visible symptoms; everything a customer does not feel yet is a ticket.
# Kube*/Node* expressions are the kubernetes-mixin canonical forms, instantiated
# with clusterLabel=cluster and job="kube-state-metrics".
groups:
  # podinfo's own SLO burn-rate and symptom alerts moved into the app's Helm
  # chart (charts/podinfo, PrometheusRule) alongside its recording rules. What
  # stays here is global: Kubernetes, node, RDS and platform alerts.
  - name: kubernetes-workloads.alerts
    rules:
      # kube_pod_info joined in so the alert carries a node label; without it the
      # NodeNotReady inhibition (equal by node) would silently never match.
      - alert: KubePodCrashLooping
        expr: |
          (
            max_over_time(
              kube_pod_container_status_waiting_reason{
                reason="CrashLoopBackOff", job="kube-state-metrics"
              }[5m]
            ) >= 1
          )
            * on (namespace, pod) group_left(node)
            kube_pod_info{job="kube-state-metrics"}
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: pod is crash looping
          description: >
            Pod {{ $labels.namespace }}/{{ $labels.pod }} container
            {{ $labels.container }} has been restarting in CrashLoopBackOff.
          runbook_url: https://runbooks.sanctum.example.com/kubernetes/pod-crashlooping

      - alert: KubePodNotReady
        expr: |
          (
            sum by (namespace, pod) (
              max by (namespace, pod) (
                kube_pod_status_phase{
                  job="kube-state-metrics", phase=~"Pending|Unknown"
                }
                or
                (
                  kube_pod_status_phase{
                    job="kube-state-metrics", phase="Running"
                  } == 1
                  and on (namespace, pod)
                  kube_pod_status_ready{
                    job="kube-state-metrics", condition="true"
                  } == 0
                )
              ) * on (namespace, pod) group_left() topk by (namespace, pod) (
                1, max by (namespace, pod, owner_kind) (
                  kube_pod_owner{owner_kind!="Job"}
                )
              )
            ) > 0
            unless on (namespace, pod)
            kube_pod_status_reason{
              job="kube-state-metrics", reason="SchedulingGated"
            } == 1
          )
            * on (namespace, pod) group_left(node)
            kube_pod_info{job="kube-state-metrics"}
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: pod stuck in a non-ready state
          description: >
            Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a
            non-ready state for longer than 15m.
          runbook_url: https://runbooks.sanctum.example.com/kubernetes/pod-not-ready

      - alert: KubeDeploymentReplicasMismatch
        expr: |
          (
            kube_deployment_spec_replicas{job="kube-state-metrics"}
              > kube_deployment_status_replicas_available{job="kube-state-metrics"}
          ) and (
            changes(
              kube_deployment_status_replicas_updated{job="kube-state-metrics"}[10m]
            ) == 0
          )
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: deployment has not matched the expected replica count
          description: >
            Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not
            matched its desired replica count for longer than 15m.
          runbook_url: https://runbooks.sanctum.example.com/kubernetes/replicas-mismatch

  - name: nodes.alerts
    rules:
      - alert: NodeNotReady
        expr: |
          kube_node_status_condition{
            job="kube-state-metrics", condition="Ready", status="true"
          } == 0
          and on (node)
          kube_node_spec_unschedulable{job="kube-state-metrics"} == 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: node is not ready
          description: >
            Node {{ $labels.node }} has been NotReady for longer than 15m.
            Karpenter should replace it; investigate if it does not.
          runbook_url: https://runbooks.sanctum.example.com/kubernetes/node-not-ready

      - alert: NodeHighCPU
        expr: |
          (
            1 - avg by (node) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            )
          ) > 0.90
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: node CPU utilization above 90%
          description: 'Node {{ $labels.node }} CPU utilization has held above 90% for 15m.'
          runbook_url: https://runbooks.sanctum.example.com/nodes/high-cpu

      - alert: NodeMemoryPressure
        expr: |
          kube_node_status_condition{
            job="kube-state-metrics", condition="MemoryPressure", status="true"
          } == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: node under memory pressure
          description: 'Node {{ $labels.node }} kubelet reports MemoryPressure.'
          runbook_url: https://runbooks.sanctum.example.com/nodes/memory-pressure

      - alert: NodeDiskPressure
        expr: |
          kube_node_status_condition{
            job="kube-state-metrics", condition="DiskPressure", status="true"
          } == 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: node under disk pressure
          description: 'Node {{ $labels.node }} kubelet reports DiskPressure.'
          runbook_url: https://runbooks.sanctum.example.com/nodes/disk-pressure

  # Backing stores are AWS-managed; metrics come from the CloudWatch exporter
  # (prometheus/cloudwatch_exporter naming: aws_rds_<metric>_<statistic>). CPU
  # and connection thresholds are absolute because CloudWatch does not export
  # the instance's max_connections; tune per instance class.
  - name: rds.alerts
    rules:
      - alert: RDSHighConnections
        expr: |
          aws_rds_database_connections_average{dbinstance_identifier="sanctum-prod"} > 180
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: RDS connection count high
          description: >
            {{ $labels.dbinstance_identifier }} averaging
            {{ $value | printf "%.0f" }} connections over 10m.
          runbook_url: https://runbooks.sanctum.example.com/rds/high-connections

      - alert: RDSLowFreeStorage
        expr: |
          aws_rds_free_storage_space_average{dbinstance_identifier="sanctum-prod"}
            < (10 * 1024 * 1024 * 1024)
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: RDS free storage below 10GiB
          description: >
            {{ $labels.dbinstance_identifier }} has less than 10GiB free storage.
          runbook_url: https://runbooks.sanctum.example.com/rds/low-storage

      - alert: RDSHighCPU
        expr: |
          aws_rds_cpuutilization_average{dbinstance_identifier="sanctum-prod"} > 85
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: RDS CPU utilization above 85%
          description: '{{ $labels.dbinstance_identifier }} CPU held above 85% for 15m.'
          runbook_url: https://runbooks.sanctum.example.com/rds/high-cpu

  - name: platform.alerts
    rules:
      # >10% of a job's targets unreachable. Catches a broken exporter or a
      # ServiceMonitor selector that stopped matching, not a single flaky pod.
      - alert: TargetDown
        expr: |
          100 * (
            count by (job, namespace) (up == 0)
            / count by (job, namespace) (up)
          ) > 10
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: scrape targets down
          description: >
            {{ $value | printf "%.0f" }}% of {{ $labels.job }} targets in
            {{ $labels.namespace }} have been unreachable for 10m.
          runbook_url: https://runbooks.sanctum.example.com/platform/target-down

      # cert-manager metric, scraped via pod annotations. Public edge TLS
      # terminates at Cloudflare; this covers in-cluster certificates.
      - alert: CertificateExpiringSoon
        expr: |
          certmanager_certificate_expiration_timestamp_seconds - time()
            < (21 * 24 * 3600)
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: certificate expiring within 21 days
          description: >
            Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in
            less than 21 days.
          runbook_url: https://runbooks.sanctum.example.com/platform/cert-expiring
