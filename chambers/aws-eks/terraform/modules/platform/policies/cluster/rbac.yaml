---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podinfo
  namespace: sanctum
rules:
  # Read-only, and scoped by resourceNames to the workload's own objects so the
  # token cannot enumerate other secrets in the namespace.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [podinfo-config]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [podinfo-secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podinfo
  namespace: sanctum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podinfo
subjects:
  - kind: ServiceAccount
    name: podinfo
    namespace: sanctum
