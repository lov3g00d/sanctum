version: '3'

# The one model for both `task chat` and `task claude`. Override per invocation,
# e.g. task chat MODEL=qwen3:4b   |   task claude MODEL=qwen2.5:14b
vars:
  MODEL: gemma4:12b
  HOST: 127.0.0.1:11434

env:
  OLLAMA_HOST: '{{.HOST}}'
  # Set the context window once on the server so every model loads with room for
  # Claude Code's agent loop (tool schemas + history overflow Ollama's small default).
  OLLAMA_CONTEXT_LENGTH: '16384'

tasks:
  default:
    cmds: [task --list]
    silent: true

  up:
    desc: Start the Ollama server (if needed) and pull the default model
    cmds:
      - bash scripts/up.sh {{.MODEL}}
      - 'echo "Ready. Try:  task chat   |   task claude"'

  chat:
    desc: 'Interactive REPL with the model (default {{.MODEL}}): task chat'
    cmds:
      - ollama run {{.MODEL}}

  ask:
    desc: 'One-shot prompt: task ask -- "explain a kubernetes readiness probe"'
    cmds:
      - ollama run {{.MODEL}} {{.CLI_ARGS}}

  claude:
    desc: 'Drive Claude Code with the local model, no cloud: task claude -- "explain this repo"'
    env:
      ANTHROPIC_BASE_URL: 'http://{{.HOST}}'
      ANTHROPIC_AUTH_TOKEN: ollama
      ANTHROPIC_MODEL: '{{.MODEL}}'
      ANTHROPIC_SMALL_FAST_MODEL: '{{.MODEL}}'
    cmds:
      - claude {{.CLI_ARGS}}

  pull:
    desc: Pull the curated CPU-friendly model set (see README for sizes)
    cmds:
      - for: [qwen3:4b, qwen3:8b, qwen2.5-coder:7b, gemma3:4b]
        cmd: ollama pull {{.ITEM}}

  status:
    desc: Show server version, installed models, and what is loaded in memory
    cmds:
      - 'echo "server: $(curl -s http://{{.HOST}}/api/version | jq -r .version)"'
      - echo "installed:"
      - curl -s http://{{.HOST}}/api/tags | jq -r '.models[] | "  \(.name)  (\(.size/1e9|floor)GB)"'
      - echo "loaded:"
      - curl -s http://{{.HOST}}/api/ps | jq -r '.models[]?.name | "  \(.)"'

  down:
    desc: Stop the Ollama server if this chamber started it (leaves pulled models on disk)
    cmds:
      - bash scripts/down.sh
