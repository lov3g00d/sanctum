# The Kafka cluster (Strimzi custom resources): node pools, listeners, topics, and users.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  labels:
    strimzi.io/cluster: sanctum
spec:
  replicas: 1
  roles:
    - controller
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  labels:
    strimzi.io/cluster: sanctum
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: persistent-claim
    size: 5Gi
    deleteClaim: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1280Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: sanctum
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    authorization:
      type: simple
      superUsers:
        - admin
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
    jvmOptions:
      -Xms: 768m
      -Xmx: 768m
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    template:
      podDisruptionBudget:
        maxUnavailable: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: demo
  labels:
    strimzi.io/cluster: sanctum
spec:
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: demo-dlq
  labels:
    strimzi.io/cluster: sanctum
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: connect-orders
  labels:
    strimzi.io/cluster: sanctum
spec:
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: admin
  labels:
    strimzi.io/cluster: sanctum
spec:
  authentication:
    type: scram-sha-512
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: producer
  labels:
    strimzi.io/cluster: sanctum
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: demo
          patternType: literal
        operations: [Describe, Write]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: consumer
  labels:
    strimzi.io/cluster: sanctum
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: demo
          patternType: literal
        operations: [Describe, Read]
        host: "*"
      - resource:
          type: topic
          name: demo-dlq
          patternType: literal
        operations: [Describe, Write]
        host: "*"
      - resource:
          type: group
          name: app
          patternType: literal
        operations: [Read]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: mtls-client
  labels:
    strimzi.io/cluster: sanctum
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: demo
          patternType: literal
        operations: [Describe, Read, Write]
        host: "*"
      - resource:
          type: group
          name: tls-demo
          patternType: literal
        operations: [Read]
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: connect
  labels:
    strimzi.io/cluster: sanctum
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: connect-cluster
          patternType: prefix
        operations: [Create, Read, Write, Describe, DescribeConfigs, Alter]
        host: "*"
      - resource:
          type: topic
          name: connect-orders
          patternType: literal
        operations: [Read, Describe]
        host: "*"
      - resource:
          type: topic
          name: orders-server
          patternType: prefix
        operations: [Create, Write, Describe]
        host: "*"
      - resource:
          type: group
          name: connect-
          patternType: prefix
        operations: [Read]
        host: "*"
      - resource:
          type: cluster
        operations: [IdempotentWrite]
        host: "*"
