# Debezium Postgres source: captures row-level changes to public.orders from the
# Postgres write-ahead log (logical replication, pgoutput) and streams them to
# Kafka as CDC events on orders-server.public.orders. topic.creation.* lets
# Connect create that topic (the cluster has broker auto-create disabled).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: orders-source
  labels:
    strimzi.io/cluster: connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: postgres
    database.port: 5432
    database.user: connect
    database.password: connect
    database.dbname: orders
    topic.prefix: orders-server
    table.include.list: public.orders
    plugin.name: pgoutput
    slot.name: debezium_orders
    publication.autocreate.mode: filtered
    snapshot.mode: initial
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 1
