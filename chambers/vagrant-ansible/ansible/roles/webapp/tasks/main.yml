---
- name: Install web-tier packages
  ansible.builtin.apt:
    name: "{{ web_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ webapp_app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Deploy the application code
  ansible.builtin.copy:
    src: app.py
    dest: "{{ webapp_app_dir }}/app.py"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
  notify: Restart webapp

- name: Deploy the application config (DB credentials from Vault)
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ webapp_app_dir }}/app.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  notify: Restart webapp

- name: Install the systemd unit
  ansible.builtin.template:
    src: webapp.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart webapp

- name: Open the app port to the private subnet
  community.general.ufw:
    rule: allow
    port: "{{ app_port }}"
    proto: tcp
    src: "{{ web_subnet }}"

- name: Ensure the app is running and enabled
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    state: started
    enabled: true
    daemon_reload: true
