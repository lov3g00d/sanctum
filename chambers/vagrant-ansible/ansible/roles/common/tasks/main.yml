---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present

- name: Set the system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true

- name: Render the MOTD from facts
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"

# Firewall: allow SSH BEFORE turning on default-deny, or the control path is
# orphaned. SSH rides the Vagrant management NAT (eth0); the app ports are
# opened per-role and scoped to the private subnet.
- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable ufw with default-deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

# SSH hardening is safe here because Vagrant authenticates with keys.
- name: Harden sshd
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.re }}"
    line: "{{ item.line }}"
    validate: "sshd -t -f %s"
  loop:
    - { re: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { re: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
  notify: Restart ssh
