  PGHOST: nimbus-prod.abc123.eu-central-1.rds.amazonaws.com
  PGPORT: "5432"
  PGDATABASE: nimbus
  PGSSLMODE: require
  REDIS_HOST: nimbus-prod.abc123.euc1.cache.amazonaws.com
  REDIS_PORT: "6379"
  REDIS_TLS: "true"
