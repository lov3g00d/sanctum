---
# AWS Load Balancer Controller (ALB). Chosen over ingress-nginx to match the
# scenario edge path (Cloudflare -> ALB -> EKS) and to associate AWS WAFv2.
# target-type ip sends traffic from the ALB ENIs straight to pod IPs, so the
# NetworkPolicy ingress rule gates the load-balancer subnet CIDR, not a namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nimbus-orders-api
  namespace: nimbus
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:eu-central-1:123456789012:regional/webacl/nimbus/00000000-0000-0000-0000-000000000000
spec:
  ingressClassName: alb
  rules:
    - host: api.nimbus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nimbus-orders-api
                port:
                  number: 80
