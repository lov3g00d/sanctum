---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nimbus

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/name: podinfo
      app.kubernetes.io/part-of: nimbus
      app.kubernetes.io/component: api
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

images:
  - name: nimbus/podinfo
    newTag: "6.14.1"
