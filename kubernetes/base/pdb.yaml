---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: podinfo
  namespace: nimbus
spec:
  # Percentage so a single PDB travels across overlays without deadlocking the
  # smaller dev replica count (2 -> allows 1 voluntary eviction).
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
      app.kubernetes.io/component: api
