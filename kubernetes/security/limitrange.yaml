---
apiVersion: v1
kind: LimitRange
metadata:
  name: nimbus-defaults
  namespace: nimbus
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 1Gi
      min:
        cpu: 10m
        memory: 32Mi
