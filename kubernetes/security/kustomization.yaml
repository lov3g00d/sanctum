---
# Cluster/namespace bootstrap, applied once per cluster ahead of the app
# overlays. Kept out of overlays/ so the cluster-scoped Kyverno policies are not
# duplicated across dev and prod. Build: kustomize build kubernetes/security
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - rbac.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - kyverno-policies.yaml
