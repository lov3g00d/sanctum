---
# CIS Amazon EKS Benchmark against the worker nodes. kube-bench reads kubelet
# config and process args off the host, so the pod needs hostPID and read-only
# host mounts and runs as root: it cannot satisfy a restricted PodSecurity or
# the repo's Kyverno guardrails (non-root, readonly-rootfs, drop-all-caps).
#
# It runs in kube-system deliberately: that namespace is excluded from the
# ClusterPolicies in kubernetes/security/kyverno-policies.yaml and is not
# PSA-restricted, so the job schedules with no policy exemption. A dedicated
# namespace would need those cluster policies amended to exempt it, which is out
# of scope for this track (kubernetes/ is not modified here).
#
# EKS control-plane checks are managed by AWS and not inspectable, so most
# controlplane/managedservices items report as manual. Node and policy checks
# are the actionable output. Results go to stdout; collect with
#   kubectl -n kube-system logs job/kube-bench
# For history, add --json --outputfile and ship to S3/Security Hub, or run
# Trivy Operator's cluster-compliance report (see trivy-operator.md).
#
# Cadence: this is a one-shot Job. For drift detection wrap the same podSpec in
# a CronJob, or re-run with `kubectl -n kube-system create job kube-bench-$(date
# +%s) --from=... ` on a schedule.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bench
  namespace: kube-system
---
# The `policies` target queries the API server for RBAC and NetworkPolicy
# objects; grant read-only on exactly those, nothing that could mutate state.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-bench-read
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, serviceaccounts]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-bench-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-bench-read
subjects:
  - kind: ServiceAccount
    name: kube-bench
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/component: cspm
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
    spec:
      serviceAccountName: kube-bench
      hostPID: true
      restartPolicy: Never
      # CIS EKS Benchmark v1.8.0 is the newest config shipped in v0.16.0.
      # Pin both together so a benchmark bump is a reviewed change.
      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.16.0
          command: [kube-bench]
          args:
            - run
            - --targets
            - node,policies,managedservices,controlplane
            - --benchmark
            - eks-1.8.0
          volumeMounts:
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
      volumes:
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
