---
# Datasource provisioning. Fixed uids so the committed dashboard JSON can
# reference them directly rather than through a per-instance import variable.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus.monitoring.svc.cluster.local:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki-gateway.monitoring.svc.cluster.local:3100
