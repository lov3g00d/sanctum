---
# Reference scrape/rule config for Nimbus. In production this is rendered by the
# kube-prometheus-stack Helm chart (Prometheus Operator manages ServiceMonitors,
# PodMonitors and PrometheusRules); the hand-written form here mirrors what the
# operator generates so the intent is reviewable in one file.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Stamped onto every alert and remote-written sample so Alertmanager can group
  # and route by cluster, and multi-cluster views stay disambiguated.
  external_labels:
    cluster: nimbus-prod
    environment: prod
    region: eu-central-1

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: [monitoring]
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          regex: alertmanager;http
          action: keep

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Generic annotation-based discovery. Any pod carrying
  # prometheus.io/scrape: "true" is scraped; cloudwatch-exporter and cert-manager
  # (whose metrics the RDS and certificate alerts depend on) arrive through here
  # rather than a dedicated job.
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: '$1:$2'
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        action: replace
        target_label: node
      - source_labels: [__meta_kubernetes_pod_phase]
        action: drop
        regex: (Failed|Succeeded)

  - job_name: nimbus-orders-api
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [nimbus]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        regex: nimbus-orders-api;metrics
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - target_label: job
        replacement: nimbus-orders-api

  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        regex: node-exporter;metrics
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance

  - job_name: kube-state-metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        regex: kube-state-metrics;http-metrics
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  - job_name: alertmanager
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        regex: alertmanager;http
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
