apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "podinfo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podinfo.labels" . | nindent 4 }}
spec:
  # Percentage so the same PDB holds across environments without deadlocking the
  # smaller dev replica count (2 -> allows 1 voluntary eviction).
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "podinfo.selectorLabels" . | nindent 6 }}
