{{- if .Values.ciliumNetworkPolicy.enabled }}
# L7 network policy for podinfo, enforced by Cilium's eBPF dataplane. The
# endpointSelector is matched with both an ingress and an egress section, so
# Cilium applies default-deny in both directions and only the listed flows are
# allowed. This adds HTTP method/path filtering that plain NetworkPolicy cannot
# express; the L3/L4 baseline stays in templates/networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "podinfo.fullname" . }}-l7
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "podinfo.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "podinfo.selectorLabels" . | nindent 6 }}
  ingress:
    # ALB IP-target mode connects from the load-balancer ENIs in the public
    # subnets, so the peer is a CIDR outside cluster identity. Partner traffic
    # and the ALB health check hit the app and probe paths.
    - fromCIDR:
        - {{ .Values.networkPolicy.ingressCidr }}
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /
              - method: GET
                path: /healthz
              - method: GET
                path: /readyz
    # Prometheus in the monitoring namespace scrapes /metrics only.
    - fromEndpoints:
        - matchLabels:
            kubernetes.io/metadata.name: monitoring
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
  egress:
    # default-deny drops DNS too; without this every name lookup fails.
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
{{- end }}
