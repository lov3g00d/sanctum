upstream podinfo {
    server podinfo:9898 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Plain HTTP: redirect to HTTPS, and serve the container liveness probe without TLS.
server {
    listen 8080;
    server_name api.sanctum.example.com;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://api.sanctum.example.com$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name api.sanctum.example.com;

    # Cert + key mounted from a Kubernetes TLS secret at /etc/nginx/tls.
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Content-Security-Policy    "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used  standard reverse-proxy Host passthrough; upstream is the fixed podinfo pool, not Host-routed
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    proxy_buffering    on;
    proxy_buffer_size  16k;
    proxy_buffers      8 16k;

    location = /healthz {
        access_log off;
        proxy_pass http://podinfo;
    }

    location / {
        limit_req        zone=api burst=20 nodelay;
        limit_req_status 429;
        limit_conn       conn 100;
        proxy_pass http://podinfo;
    }
}
