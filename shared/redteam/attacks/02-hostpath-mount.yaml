---
# CONTROLLED TEST - authorized self-validation of the Sanctum platform.
# MITRE ATT&CK for Containers: T1611 Escape to Host.
# Attempt: mount the host root filesystem (hostPath /) into a pod in
# namespace sanctum. Writable host root is a direct escape: drop a file in
# /etc/cron.d or overwrite a kubelet binary and you own the node.
# Expected outcome: REJECTED at admission. PSA "restricted" forbids hostPath
# volumes outright. The pod never schedules.
# This manifest is built to fail admission. That rejection is the PASS.
apiVersion: v1
kind: Pod
metadata:
  name: rt-02-hostpath
  namespace: sanctum
  labels:
    redteam.sanctum/controlled-test: "true"
    redteam.sanctum/control-class: admission-deny
    app.kubernetes.io/part-of: sanctum-redteam
  annotations:
    redteam.sanctum/mitre: T1611
    redteam.sanctum/mitre-name: Escape to Host
    redteam.sanctum/control: PSA restricted (hostPath volumes forbidden)
    redteam.sanctum/expected: Admission DENY - hostPath volumes are not allowed under restricted
spec:
  restartPolicy: Never
  containers:
    - name: attacker
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "ls -la /host && sleep 3600"]
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
