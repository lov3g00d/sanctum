---
# Argo Rollout for podinfo. A Rollout REPLACES the Deployment: to adopt
# progressive delivery you drop kubernetes/base/deployment.yaml from the overlay
# and reconcile this instead (the podSpec below mirrors that Deployment so the
# hardened posture carries over unchanged). Kept out of the default overlays here
# because it is an opt-in example, not the baseline the ApplicationSet ships.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  namespace: nimbus
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/part-of: nimbus
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
      app.kubernetes.io/component: api
  strategy:
    canary:
      steps:
        - setWeight: 20
        # Bake before the first analysis so the 5m-rate recording rules have
        # canary traffic to measure rather than an empty window.
        - pause:
            duration: 5m
        - analysis:
            templates:
              - templateName: podinfo-slo
        - setWeight: 50
        - analysis:
            templates:
              - templateName: podinfo-slo
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: podinfo
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: podinfo
              app.kubernetes.io/component: api
      containers:
        - name: podinfo
          image: nimbus/podinfo:6.14.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
          envFrom:
            - configMapRef:
                name: podinfo-config
            - secretRef:
                name: podinfo-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
