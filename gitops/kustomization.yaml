---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace transformer here: AppProject and ApplicationSet must stay in
# `argocd`, but the app overlays these reference set `namespace: nimbus`. A
# namespace transformer would rewrite the CRs into the wrong namespace.
# The Rollout example is intentionally excluded (see rollouts/).
resources:
  - appproject.yaml
  - applicationset.yaml
